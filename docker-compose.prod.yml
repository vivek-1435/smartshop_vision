# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.prod.yml  —  AWS EC2 PRODUCTION
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from docker-compose.yml:
#   • NO local MongoDB container (uses Atlas via MONGODB_URI env var)
#   • Automatic image restart policy
#   • Logging limits so disk doesn't fill up
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ── Backend API ──────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smartshop-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${PORT:-4000}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME must be set}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY must be set}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - api_logs:/app/logs
    # Do NOT expose port 4000 publicly — nginx proxies internally
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [smartshop]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 384M

  # ── Frontend (Nginx) ─────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty → uses relative /api URLs → nginx proxies to backend
        VITE_API_URL: ""
        VITE_SHOP_QR_BASE: ${FRONTEND_URL:-http://localhost}
    image: smartshop-web
    restart: always
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks: [smartshop]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 64M

volumes:
  api_logs:

networks:
  smartshop:
    driver: bridge
