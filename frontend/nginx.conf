server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                                      always;
    add_header X-Content-Type-Options    "nosniff"                                          always;
    add_header X-XSS-Protection          "1; mode=block"                                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                  always;
    add_header Permissions-Policy        "camera=self, microphone=(), geolocation=()"       always;
    # CSP: allow TF Hub model + Cloudinary images; tighten connect-src if you change API host
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-eval'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: blob: https://res.cloudinary.com; \
         connect-src 'self' https://tfhub.dev https://www.kaggle.com blob:; \
         worker-src 'self' blob:; \
         frame-ancestors 'none';"
        always;

    # ── Static asset caching (Vite hashes filenames → safe to cache forever) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Never cache HTML (so new deployments are picked up immediately) ────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ── Health endpoint proxy ─────────────────────────────────────
    location = /health {
        proxy_pass         http://api:4000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header         Cache-Control "no-store";
    }

    # ── API reverse proxy — /api/* → api container ────────────────
    # IMPORTANT: proxy_pass ends with / to strip the /api prefix.
    # e.g. GET /api/auth/login → http://api:4000/api/auth/login
    # The Express app mounts routes at /api/* so we keep the /api prefix.
    location /api/ {
        proxy_pass         http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # ── React Router — all routes serve index.html ────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
